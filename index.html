<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#3b82f6" />
    <script>
      // Turbo mode (opt-in): register the COOP/COEP service worker so the
      // multi-threaded ffmpeg core can use SharedArrayBuffer. Safe default off.
      try {
        if (localStorage.getItem("vg.turbo") === "1") {
          window.coi = { coepCredentialless: function () { return true; }, quiet: true };
          var sc = document.createElement("script");
          sc.src = "coi-serviceworker.js";
          document.head.appendChild(sc);
        }
      } catch (e) {}
    </script>
    <title>Video Generator — browser video montages</title>
    <meta name="description" content="Create video montages in your browser from royalty-free Pexels clips. 100% client-side, powered by ffmpeg.wasm." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
