name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Compute build metadata
        run: echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /video-generator/
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_RUN: ${{ github.run_number }}
          VITE_BUILD_TIME: ${{ env.VITE_BUILD_TIME }}

      - name: Prepare for Pages
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      # Publish to the gh-pages branch (bypasses the GitHub Pages deployment API,
      # which was getting stuck in 'deployment_queued'). Set Pages Source to
      # "Deploy from a branch" -> gh-pages -> / (root).
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
